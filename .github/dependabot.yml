# Weekly dependency update pull requests. Minor and patch updates are grouped
# into one PR per ecosystem so there is little to review; CI runs on each PR.
# Security updates are separate and immediate once "Dependabot security
# updates" is switched on in the repo settings.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/extensions"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
