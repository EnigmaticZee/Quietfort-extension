# Builds the Chrome and Firefox packages for a version tag (v1.2.3) and attaches
# them to that tag's GitHub release, under fixed names so the website's
# ".../releases/latest/download/quietfort-chrome.zip" links always work.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extensions/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: node scripts/build.mjs chrome firefox
      - name: Package
        run: |
          (cd dist/chrome && zip -qr ../../quietfort-chrome.zip .)
          (cd dist/firefox && zip -qr ../../quietfort-firefox.zip .)
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Quietfort $GITHUB_REF_NAME" --notes "Install instructions: https://enigmaticzee.github.io/Quietfort-extension/#download"
          gh release upload "$GITHUB_REF_NAME" quietfort-chrome.zip quietfort-firefox.zip --clobber
