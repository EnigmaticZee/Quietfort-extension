<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dangerous site blocked</title>
  <style>
    /* Themes: same tokens as popup.css (shared/theme.ts sets data-theme). */
    :root { --bg: #f2f2f5; --card: #fff; --fg: #1d1d1f; --muted: #5e5e63; --accent: #127a6d; --on-accent: #fff; --link: #127a6d;
            --danger: #c4281c; --danger-soft: #fde7e4; --border: transparent; color-scheme: light; }
    :root[data-theme="fortNight"] { --bg: #081a1d; --card: #112b30; --fg: #e3f0ee; --muted: #9dbab5; --accent: #3cc2ad; --on-accent: #062226; --link: #5fd6c3;
            --danger: #ff7a6b; --danger-soft: #3d1a17; --border: #18393f; color-scheme: dark; }
    :root[data-theme="graphite"] { --bg: #1e1e1e; --card: #2c2c2e; --fg: #f5f5f7; --muted: #a8a8ad; --accent: #2aa896; --on-accent: #fff; --link: #4fd1bd;
            --danger: #ff6b5e; --danger-soft: #3d1d1a; --border: transparent; color-scheme: dark; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
           display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { max-width: 520px; text-align: center; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 36px 40px 28px; }
    .icon { width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 14px; display: grid; place-items: center; background: var(--danger-soft); color: var(--danger); }
    .icon svg { width: 30px; height: 30px; }
    h1 { font-size: 22px; line-height: 1.25; margin: 0 0 10px; text-wrap: balance; }
    p { margin: 0 0 8px; }
    .host { font-weight: 600; word-break: break-all; }
    .muted { color: var(--muted); font-size: 13px; }
    .actions { display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 22px 0 14px; }
    button { font: inherit; cursor: pointer; border: 0; background: none; color: var(--link); font-size: 13px; font-weight: 600; padding: 4px 8px; }
    #back { background: var(--accent); color: var(--on-accent); border-radius: 9px; padding: 10px 28px; font-size: 15px; }
    #source { margin-top: 6px; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10v5M12 18h.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></div>
    <h1 id="title">This site is known for phishing or malware</h1>
    <p id="what">The address <span class="host" id="host"></span> is on a list of dangerous sites. It may try to steal your passwords or card details, or install harmful software.</p>
    <div class="actions">
      <button id="back">Go back to safety</button>
      <button id="continue">Continue anyway (this site, this time)</button>
    </div>
    <p class="muted" id="source"></p>
    <p class="muted" id="error" hidden></p>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
